<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${title != null ? title + ' | Playful Kanban' : 'Playful Kanban System'}">Playful Kanban</title>

    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Playful Geometric Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/playful-geometric.css}" href="/css/playful-geometric.css">
</head>
<body>

    <!-- Header Navbar -->
    <header th:fragment="navbar" class="playful-navbar">
        <div class="container-fluid px-lg-5">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                
                <!-- Brand Badge -->
                <a th:href="@{/boards}" href="/boards" class="brand-badge">
                    <span class="brand-icon"><i class="fa-solid fa-shapes"></i></span>
                    <span>KanbanPop!</span>
                </a>

                <!-- Nav Actions -->
                <div class="d-flex align-items-center gap-2 gap-md-3 flex-wrap">
                    
                    <!-- Authenticated Links -->
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2 gap-md-3 flex-wrap">
                        <a th:href="@{/boards}" href="/boards" class="btn-candy btn-candy-white btn-candy-sm">
                            <i class="fa-solid fa-table-columns"></i>
                            <span>My Boards</span>
                        </a>

                        <!-- Admin Panel link -->
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" href="/admin" class="btn-candy btn-candy-yellow btn-candy-sm">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>Admin Portal</span>
                        </a>

                        <!-- User Profile Pill -->
                        <div class="d-none d-sm-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill" style="border: 2px solid #1E293B; background: #FFFFFF; box-shadow: 2px 2px 0px #1E293B; font-weight: 700; font-size: 0.85rem;">
                            <span class="text-truncate" style="max-width: 120px;" sec:authentication="name">Username</span>
                            <span sec:authorize="hasRole('ADMIN')" class="badge bg-warning text-dark border border-dark rounded-pill" style="font-size: 0.68rem;">ADMIN</span>
                            <span sec:authorize="!hasRole('ADMIN')" class="badge bg-info text-dark border border-dark rounded-pill" style="font-size: 0.68rem;">USER</span>
                        </div>

                        <!-- Logout Form -->
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn-candy btn-candy-secondary btn-candy-sm" title="Log Out">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                <span class="d-none d-md-inline">Logout</span>
                            </button>
                        </form>
                    </div>

                    <!-- Unauthenticated Links -->
                    <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center gap-2">
                        <a th:href="@{/login}" href="/login" class="btn-candy btn-candy-white btn-candy-sm">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>Log In</span>
                        </a>
                        <a th:href="@{/register}" href="/register" class="btn-candy btn-candy-primary btn-candy-sm">
                            <i class="fa-solid fa-sparkles"></i>
                            <span>Sign Up</span>
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </header>

    <!-- Global Flash Alerts Fragment -->
    <div th:fragment="alerts" class="container-fluid px-lg-5 mt-3">
        <div th:if="${successMessage}" class="playful-alert playful-alert-success playful-alert-auto-dismiss">
            <i class="fa-solid fa-circle-check fs-5"></i>
            <span th:text="${successMessage}">Operation completed successfully!</span>
        </div>
        <div th:if="${errorMessage}" class="playful-alert playful-alert-danger">
            <i class="fa-solid fa-triangle-exclamation fs-5"></i>
            <span th:text="${errorMessage}">Something went wrong.</span>
        </div>
        <div th:if="${logoutMessage}" class="playful-alert playful-alert-info playful-alert-auto-dismiss">
            <i class="fa-solid fa-info fs-5"></i>
            <span th:text="${logoutMessage}">You have logged out.</span>
        </div>
    </div>

    <!-- Playful Footer Fragment -->
    <footer th:fragment="footer" class="playful-footer">
        <div class="container-fluid px-lg-5 text-center">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                <div>
                    <strong>KanbanPop!</strong> &copy; 2026 &mdash; Built with Spring Boot 3, Thymeleaf &amp; Playful Geometric Design.
                </div>
                <div class="d-flex gap-3 align-items-center">
                    <span class="badge border border-dark rounded-pill px-3 py-1" style="background: var(--tertiary-yellow-light); color: var(--text-main); font-weight: 700;">
                        <i class="fa-solid fa-leaf text-success me-1"></i> Spring Boot 3.3.4
                    </span>
                    <span class="badge border border-dark rounded-pill px-3 py-1" style="background: var(--accent-violet-light); color: var(--text-main); font-weight: 700;">
                        <i class="fa-solid fa-lock text-primary me-1"></i> Spring Security 6
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <!-- Bootstrap 5 Bundle JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Kanban Custom JS -->
        <script th:src="@{/js/kanban.js}" src="/js/kanban.js"></script>
    </div>

</body>
</html>

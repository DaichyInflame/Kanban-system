<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Task')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanbanPop! | Edit Task</title>
</head>
<body>

    <!-- Header Navbar -->
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                
                <div class="sticker-card p-4 p-md-5" style="box-shadow: 8px 8px 0px #1E293B;">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <a th:href="@{'/boards/' + ${boardId}}" class="btn-candy btn-candy-white btn-candy-sm">
                            <i class="fa-solid fa-arrow-left"></i> Back to Board
                        </a>
                        <span class="badge border border-dark rounded-pill px-3 py-1" style="background: var(--tertiary-yellow); color: var(--text-main); font-weight: 700;">
                            EDIT TASK
                        </span>
                    </div>

                    <h2 class="h3 fw-black mb-3">Modify Task Details</h2>

                    <form th:action="@{'/boards/' + ${boardId} + '/tasks/' + ${taskId} + '/edit'}" th:object="${task}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" th:field="*{id}" />

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="taskTitle" class="playful-label">Task Title *</label>
                            <input type="text" id="taskTitle" th:field="*{title}" class="form-control playful-input"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" required>
                            <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                Title error.
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="taskDesc" class="playful-label">Description (Optional)</label>
                            <textarea id="taskDesc" th:field="*{description}" class="form-control playful-input" rows="4"></textarea>
                        </div>

                        <!-- Status & Priority Row -->
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="taskStatus" class="playful-label">Status *</label>
                                <select id="taskStatus" th:field="*{status}" class="form-select playful-input" required>
                                    <option th:each="st : ${T(com.example.kanban.model.TaskStatus).values()}"
                                            th:value="${st}" th:text="${st.displayName}">To Do</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="taskPriority" class="playful-label">Priority *</label>
                                <select id="taskPriority" th:field="*{priority}" class="form-select playful-input" required>
                                    <option th:each="pr : ${T(com.example.kanban.model.TaskPriority).values()}"
                                            th:value="${pr}" th:text="${pr.displayName}">Medium</option>
                                </select>
                            </div>
                        </div>

                        <!-- Due Date -->
                        <div class="mb-4">
                            <label for="taskDueDate" class="playful-label">Due Date (Optional)</label>
                            <input type="date" id="taskDueDate" th:field="*{dueDate}" class="form-control playful-input"
                                   th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid' : ''">
                            <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">
                                Due date error.
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn-candy btn-candy-yellow flex-grow-1 justify-content-center py-2">
                                <i class="fa-solid fa-floppy-disk"></i> Update Task
                            </button>
                            <a th:href="@{'/boards/' + ${boardId}}" class="btn-candy btn-candy-white py-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
